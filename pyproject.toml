[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knxgatetool"
version = "0.1.0"
description = "Modern KNX/SCS gateway desktop monitor for macOS and Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7", "pyserial>=3.5,<4"]
license = {text = "MIT"}
authors = [{name = "KNXGateTool contributors"}]
keywords = ["knx", "scs", "vimar", "gateway", "automation"]

[project.scripts]
knxgatetool = "knxgatetool.__main__:main"

[tool.setuptools.packages.find]
include = ["knxgatetool*"]
