name: Tests and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check UI import
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtCore import QTimer; from knxgatetool.ui import MainWindow; a=QApplication([]); w=MainWindow(); w.show(); QTimer.singleShot(200, a.quit); a.exec(); w.close(); print('Qt GUI smoke test OK')"
        env:
          QT_QPA_PLATFORM: offscreen

  desktop:
    name: Package on ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e . pyinstaller
      - name: Build desktop app
        run: pyinstaller --noconfirm --clean --windowed --name KNXGateTool --paths . knxgatetool/__main__.py
      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/KNXGateTool -DestinationPath dist/KNXGateTool-Windows.zip
      - name: Package macOS ZIP (preserve app permissions)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/KNXGateTool.app dist/KNXGateTool-macOS.zip
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNXGateTool-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
