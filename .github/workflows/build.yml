name: Tests and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check UI import
        run: python -c "from knxgatetool.ui import MainWindow; print('Qt GUI import OK')"
        env:
          QT_QPA_PLATFORM: offscreen

  desktop:
    name: Package on ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e . pyinstaller
      - name: Build desktop app
        run: pyinstaller --noconfirm --clean --windowed --name KNXGateTool --paths . knxgatetool/__main__.py
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNXGateTool-${{ runner.os }}
          path: dist/KNXGateTool*
          if-no-files-found: error
